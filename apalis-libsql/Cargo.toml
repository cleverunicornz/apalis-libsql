[package]
name = "apalis-libsql"
version = "0.1.0"
authors = ["Apalis Contributors"]
readme = "README.md"
edition = "2021"
repository = "https://github.com/geofmureithi/apalis"
license = "MIT"
description = "Background task processing for rust using apalis and libSQL"
keywords = ["apalis", "background-jobs", "task-queue", "libsql", "turso"]
categories = ["asynchronous", "database"]

[dependencies]
apalis-core = "1.0.0-beta.2"
apalis-sql = "1.0.0-beta.2"
libsql = "0.9"
tokio = { version = "1.48.0", features = ["rt", "sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"
async-trait = "0.1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0.0"
pin-project = "1.1.10"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }
apalis = { version = "1.0.0-beta.2" }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
type_complexity = "allow"
manual_let_else = "warn"
match_same_arms = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
must_use_candidate = "warn"
needless_borrow = "warn"
needless_continue = "warn"
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"
option_option = "warn"
redundant_clone = "warn"